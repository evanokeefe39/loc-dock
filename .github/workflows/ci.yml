name: CI

on:
  push:
    branches: [master, main]
    paths:
      - "loc-dock-tauri/**"
      - "!loc-dock-tauri/**/*.md"
      - ".github/workflows/**"
  pull_request:
    branches: [master, main]
    paths:
      - "loc-dock-tauri/**"
      - "!loc-dock-tauri/**/*.md"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-24.04

    runs-on: ${{ matrix.platform }}

    defaults:
      run:
        working-directory: loc-dock-tauri

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: loc-dock-tauri/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: loc-dock-tauri/src-tauri -> target

      - name: Check Rust
        working-directory: loc-dock-tauri/src-tauri
        env:
          DUCKDB_DOWNLOAD_LIB: 1
        run: cargo check
