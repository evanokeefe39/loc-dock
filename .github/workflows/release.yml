name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to VS 2022 (still ships stdext::checked_array_iterator) —
          # windows-latest is on VS 2026 whose STL dropped it, breaking the
          # bundled DuckDB fmt build. See ISSUES.md #7.
          - platform: windows-2022
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: ubuntu-24.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: loc-dock-tauri/package-lock.json

      - name: Install frontend dependencies
        working-directory: loc-dock-tauri
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: loc-dock-tauri/src-tauri -> target

      - name: Compute clean version
        id: version
        shell: bash
        run: echo "clean=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          projectPath: loc-dock-tauri
          tagName: ${{ github.ref_name }}
          # Release title format: "LOC Dock vX.Y.Z" — consistent across all releases.
          releaseName: "LOC Dock ${{ github.ref_name }}"
          # Curated template pre-pended to auto-generated notes (see .github/RELEASE_TEMPLATE.md).
          # Edit this block before tagging to summarize the release.
          releaseBody: |
            ## LOC Dock ${{ github.ref_name }}

            _Bug-fix release: the summary panel no longer gets stuck on "loading…" when the LLM returns empty output._

            ### What's New

            - Oh My Pi (OMP) session usage tracking connector
            - Release workflow now bundles installers for Windows (NSIS + MSI), macOS (Apple Silicon), and Linux (deb/rpm/AppImage) with a download table

            ### Fixes

            - Summary panel stuck on "loading…" with no AI highlights — empty LLM responses (reasoning-model token burn) are now loud failures that trip the circuit breaker instead of a silent infinite retry loop
            - OMP connector: missing enum declaration from the merge

            ### Downloads

            | Platform | File | Notes |
            |----------|------|-------|
            | Windows  | `LOC.Dock_${{ steps.version.outputs.clean }}_x64-setup.exe` | NSIS installer |
            | Windows  | `LOC.Dock_${{ steps.version.outputs.clean }}_x64_en-US.msi` | MSI installer |
            | macOS    | `LOC.Dock_${{ steps.version.outputs.clean }}_aarch64.dmg` | Apple Silicon |
            | macOS    | `LOC.Dock_aarch64.app.tar.gz` | Universal binary tarball |
            | Linux    | `LOC.Dock_${{ steps.version.outputs.clean }}_amd64.deb` | Debian/Ubuntu |
            | Linux    | `LOC.Dock-${{ steps.version.outputs.clean }}-1.x86_64.rpm` | Fedora/RHEL |
            | Linux    | `LOC.Dock_${{ steps.version.outputs.clean }}_amd64.AppImage` | Portable |
            ### Notes

            - v0.2.3 was drafted but never published; v0.2.4 supersedes it.
            - Repos whose summaries failed before this release are retried automatically on the next cycle — no manual cache reset needed.
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
