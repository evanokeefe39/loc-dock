name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Tag must match all three version files
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CONF=$(jq -r .version loc-dock-tauri/src-tauri/tauri.conf.json)
          CARGO=$(grep -m1 '^version' loc-dock-tauri/src-tauri/Cargo.toml | cut -d'"' -f2)
          NPM=$(jq -r .version loc-dock-tauri/package.json)
          echo "tag=$TAG  tauri.conf=$CONF  cargo=$CARGO  npm=$NPM"
          if [ "$TAG" != "$CONF" ] || [ "$TAG" != "$CARGO" ] || [ "$TAG" != "$NPM" ]; then
            echo "::error::version mismatch — bump all three files to $TAG"
            exit 1
          fi
  build:
    needs: [verify-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to VS 2022 (still ships stdext::checked_array_iterator) —
          # windows-latest is on VS 2026 whose STL dropped it, breaking the
          # bundled DuckDB fmt build. See ISSUES.md #7.
          - platform: windows-2022
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: ubuntu-24.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: loc-dock-tauri/package-lock.json

      - name: Install frontend dependencies
        working-directory: loc-dock-tauri
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: loc-dock-tauri/src-tauri -> target

      - name: Compute clean version
        id: version
        shell: bash
        run: echo "clean=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Render release notes
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<RELEASE_BODY_EOF'
            sed "s/X\.Y\.Z/${{ steps.version.outputs.clean }}/g" .github/RELEASE_TEMPLATE.md
            echo 'RELEASE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          projectPath: loc-dock-tauri
          tagName: ${{ github.ref_name }}
          # Release title format: "LOC Dock vX.Y.Z" — consistent across all releases.
          releaseName: "LOC Dock ${{ github.ref_name }}"
          # Curated release notes from .github/RELEASE_TEMPLATE.md; X.Y.Z placeholders
          # are substituted with the clean version. Edit the template before tagging.
          releaseBody: ${{ steps.notes.outputs.body }}
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
  publish:
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish release
        run: gh release edit ${{ github.ref_name }} --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
