<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOC Dock</title>
    <style>
      html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
      /* Instant boot loader — painted the moment the webview loads HTML, before the
         JS bundle or any backend data. React replaces #root's contents on mount. */
      .boot-loader {
        position: fixed; inset: 0; display: flex;
        align-items: center; justify-content: center;
        background: rgba(32, 32, 32, 0.92); border-radius: 12px;
      }
      .boot-spinner {
        width: 26px; height: 26px; border-radius: 50%;
        border: 3px solid #3a3a3a; border-top-color: #a78bfa;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader"><div class="boot-spinner"></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
