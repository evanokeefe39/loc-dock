[package]
name = "loc-dock"
version = "0.2.0"
description = "Floating desktop widget that tracks your daily dev metrics at a glance"
default-run = "loc-dock"
authors = ["Evan O'Keefe"]
license = "MIT"
repository = "https://github.com/evanokeefe39/loc-dock"
edition = "2021"

[lib]
name = "loc_dock_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# Pinned exact: the bundled feature compiles DuckDB's vendored C++ from source,
# so a version bump changes that source (toolchain-compat risk) and busts every
# build cache. Pin so the build stays deterministic and cacheable; bump
# deliberately. See ISSUES.md #7.
duckdb = { version = "=1.10503.1", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tokio = { version = "1", features = ["time", "sync"] }
dotenvy = "0.15"
glob = "0.3"
log = "0.4"
env_logger = "0.11"
dirs = "6"
regex = "1"
rayon = "1"
iana-time-zone = "0.1"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
tauri-plugin-autostart = "2"

[[bin]]
name = "loc-dock"
path = "src/main.rs"


[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"

# The bundled DuckDB C++ amalgamation is large; we never debug into its
# vendored sources. Dropping dev-profile debug info (`-Z7`) for it noticeably
# cuts compile time and peak memory locally and in CI. Our own Rust crates
# keep full debug info.
[profile.dev.package.libduckdb-sys]
debug = false
