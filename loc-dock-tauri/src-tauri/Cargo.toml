[package]
name = "loc-dock"
version = "0.1.1"
description = "Floating desktop widget that tracks your daily dev metrics at a glance"
authors = ["Evan O'Keefe"]
license = "MIT"
repository = "https://github.com/evanokeefe39/loc-dock"
edition = "2021"

[lib]
name = "loc_dock_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
duckdb = { version = "1", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tokio = { version = "1", features = ["time", "sync"] }
dotenvy = "0.15"
glob = "0.3"
log = "0.4"
env_logger = "0.11"
dirs = "6"
regex = "1"
iana-time-zone = "0.1"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
tauri-plugin-autostart = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
