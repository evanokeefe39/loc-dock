[package]
name = "loc-dock-tauri"
version = "0.1.0"
description = "LOC Dock — floating desktop widget for daily dev metrics"
authors = ["you"]
edition = "2021"

[lib]
name = "loc_dock_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
duckdb = { version = "1", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tokio = { version = "1", features = ["time", "sync"] }
dotenvy = "0.15"
glob = "0.3"
log = "0.4"
env_logger = "0.11"
dirs = "6"
regex = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"

